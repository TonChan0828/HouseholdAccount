name: Migration Drift

# main への push で Vercel は自動デプロイされるが、本番DBのマイグレーションは手動適用。
# リポジトリと本番DBの適用状況がずれていないかを PR・main・毎日の定期実行で検知する。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Compare local and production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: bkljkdkldaiemwpnjuks
        run: node scripts/check-migration-drift.mjs
