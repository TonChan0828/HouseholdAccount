name: Mutation Testing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/amount-expression.ts"
      - "lib/settlement.ts"
      - "lib/budget.ts"
      - "lib/forecast.ts"
      - "lib/analytics.ts"
      - "lib/category-matrix.ts"
      - "lib/savings-goal.ts"
      - "lib/period.ts"
      - "lib/transaction-filter.ts"
      - "lib/transactions/mirror.ts"
      - "stryker.config.json"

jobs:
  mutation:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
