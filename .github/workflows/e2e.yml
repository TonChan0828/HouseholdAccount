name: E2E

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Prepare Supabase and Chromium in parallel
        run: |
          supabase start --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta &
          supabase_pid=$!
          (npm ci && npx playwright install --with-deps chromium) &
          browser_pid=$!
          status=0
          wait "$supabase_pid" || status=$?
          wait "$browser_pid" || status=$?
          exit "$status"
      - name: Configure local Supabase
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Seed E2E users and fixtures
        run: node e2e/seed.mjs
      - run: npm run test:e2e
      - name: Check import preview against a production build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3217
          E2E_PORT: 3217
          E2E_PRODUCTION_BUILD: "true"
          RATE_LIMIT_SECRET: local-preview-test-rate-limit-key-only
        run: |
          npm run build
          npm run test:e2e -- --workers=1 e2e/transactions-import.spec.ts --grep '500行のプレビュー'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
