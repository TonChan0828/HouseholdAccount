name: Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verified:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for CI, Database and E2E on this commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]; then
              echo "::error::A newer main commit superseded this release."
              exit 1
            fi
            ready=true
            for workflow in ci.yml database.yml e2e.yml; do
              run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --commit "$GITHUB_SHA" --event push --branch main --limit 1 \
                --json conclusion,status --jq '.[0] // {}')
              status=$(jq -r '.status // ""' <<< "$run")
              conclusion=$(jq -r '.conclusion // ""' <<< "$run")
              if [ "$status" = completed ] && [ "$conclusion" != success ]; then
                echo "::error::$workflow concluded with $conclusion."
                exit 1
              fi
              if [ "$conclusion" != success ]; then ready=false; fi
            done
            if [ "$ready" = true ]; then exit 0; fi
            sleep 30
          done
          echo "::error::Timed out waiting for validated main checks."
          exit 1

  publish:
    needs: verified
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: Production
    env:
      SUPABASE_PROJECT_REF: bkljkdkldaiemwpnjuks
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Install pinned Vercel CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel" vercel@66.5.0
          echo "$RUNNER_TEMP/vercel/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify target and credentials before changing production
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Missing Production SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_DB_PASSWORD:?Missing Production SUPABASE_DB_PASSWORD}"
          : "${VERCEL_TOKEN:?Missing Production VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?Missing Production VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Missing Production VERCEL_PROJECT_ID}"
          : "${VERCEL_SCOPE:?Missing Production VERCEL_SCOPE}"
          [[ "$PRODUCTION_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          vercel project inspect "$VERCEL_PROJECT_ID" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          node scripts/check-migration-drift.mjs --allow-pending-tail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --dry-run
      - name: Apply and verify compatible migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --linked --yes
          node scripts/check-migration-drift.mjs
      - name: Deploy and check the release candidate
        id: candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep Supabase's local link metadata outside the deployment upload.
          rm -rf supabase/.temp
          url=$(vercel deploy --prod --skip-domain --archive=tgz --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          [[ "$url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]
          vercel curl /login --deployment "$url" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" -- --fail --silent --show-error --max-time 30 --output /dev/null
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Promote the checked candidate and verify the live domain
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          vercel promote "$CANDIDATE_URL" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$PRODUCTION_URL/login"
          printf 'Published `%s` from %s\n' "$GITHUB_SHA" "$CANDIDATE_URL" >> "$GITHUB_STEP_SUMMARY"
